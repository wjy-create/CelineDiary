<!DOCTYPE html>
<html lang="zh-CN" data-look="sky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4eee3">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Celine Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
/* Celine Diary v2 · 2026-09-21 · 视觉重做（样稿 design/2026-09-21_三个方向.html，她选「B 纸本为底，入夜换 A 深色」）。
   数据与口径同 diary.html（v1 原样保留）；只读页面：无输入、无按钮墙、无总分、无待办。
   09-21 她定「天色」：背景是此刻的天空，按南京当天真实日出日落插值（黎明→上午→正午→金色时刻→黄昏→蓝调→夜）；
   上方纸本 / 夜航变量保留作底层默认，被 html[data-look=sky] 覆盖。22:45 后手机是灰度——层级靠明暗和字形，不靠颜色。
   09-22 印刷感一轮（她看了 zaraintokyo.com 后定）：圆角 22→4 + 发丝线；首页大数字不进卡；强调词上朱红代替荧光笔；主线色降饱和；数字 Cormorant 300；
   加一套自绘内联 SVG（规范：方形画布、墨线 1.5 圆头、只三种填充＝纸/墨/一处朱红；sky-dark 下墨纸互换）——首页日/月按真实日出日落走位，八条主线各一枚。
   09-23 她看第三批后提的三条体验修正：①今天页能往前翻（‹ › + 横向滑动，最多 14 天＝镜像窗口）；
   ②主线页的状态印章从「饿/稳/满」三个宋体字改成图鉴风格的记号，措辞改判为久未碰/平稳/充足；
   ③本周页五组图全部换成内联 SVG（格子条 / 方格 / 圆点 / 量规 / 堆叠条 / 小时间轴），同一支笔。 */
:root{
  --paper:#f4eee3;--ink:#231e19;--ink2:#6f655a;--ink3:#a69b8d;--accent:#b3342a;--accent-soft:rgba(179,52,42,.22);
  --rule:rgba(90,110,140,.13);--margin:rgba(179,52,42,.35);--glow:none;--grain:0;
  --num:"Fraunces",Georgia,serif;--num-style:normal;--num-weight:300;
  --text:"LXGW WenKai Screen","Songti SC","STSong","Noto Serif SC",serif;
  --c-work:#5f7fa6;--c-rel:#c0675e;--c-body:#5f9a7e;--c-self:#8a7fbf;--c-baby:#d49a4c;--c-invest:#6f94a8;--c-works:#b08a4f;--c-life:#b3a898;--c-rest:#cfc6b8;--c-hole:#b3342a;
}
html.night{
  --paper:#130e0d;--ink:#e8dfd4;--ink2:#9d9186;--ink3:#5f554e;--accent:#c9a46a;--accent-soft:rgba(201,164,106,.22);
  --rule:rgba(232,223,212,.045);--margin:rgba(201,164,106,.22);
  --glow:radial-gradient(120% 900px at 50% -160px,#3b1715 0%,rgba(59,23,21,0) 70%);--grain:.07;
  --num:"Cormorant Garamond",Georgia,serif;--num-style:italic;--num-weight:400;
  --c-work:#6b89a8;--c-rel:#b8605a;--c-body:#6f9a86;--c-self:#8d86b8;--c-baby:#c9a46a;--c-invest:#7896a6;--c-works:#b39463;--c-life:#6c645c;--c-rest:#3a302b;--c-hole:#d06a52;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;min-height:100vh;color:var(--ink);font:15.5px/30px var(--text);background:var(--glow) no-repeat,var(--paper);
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;transition:background-color .6s}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 30px;background-position:0 14px}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.page{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 24px 20px 46px}
.page:before{content:"";position:absolute;top:0;bottom:-2000px;left:30px;border-left:1px solid var(--margin)}
.num{font-family:var(--num);font-style:var(--num-style);font-weight:var(--num-weight);font-variation-settings:"opsz" 144;font-variant-numeric:lining-nums tabular-nums}

/* 头 */
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date b{display:block;font-weight:400;font-size:30px;line-height:1.15;letter-spacing:.02em}
.date span{color:var(--ink2);font-size:15px}
.seal{flex:none;width:60px;height:60px;border:2px solid var(--accent);color:var(--accent);border-radius:6px;display:grid;place-items:center;text-align:center;line-height:1.05;transform:rotate(-6deg);font-size:15px;opacity:.9;margin-top:4px}
.seal small{display:block;font:400 12px/1 var(--num);font-style:var(--num-style);margin-top:3px;letter-spacing:.02em}
.warn{color:var(--accent);font-size:13px;line-height:22px;margin-top:6px}

/* 收工块 */
.close{margin-top:26px}
.count{display:flex;align-items:baseline;gap:12px}
.count .n{font-size:96px;line-height:.9;color:var(--accent);letter-spacing:-.02em}
html:not(.night) .count .n{color:var(--ink)}
.count .l{font-size:13px;color:var(--ink2);letter-spacing:.35em;writing-mode:vertical-rl;line-height:1.15}
.lede{font-size:22px;line-height:1.55;margin:14px 0 0;letter-spacing:.02em}
.lede .nb{white-space:nowrap}
.lede u{text-decoration:none;background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.nudge{margin:14px 0 0;font-size:15.5px;line-height:30px}
.nudge .tail{display:block;color:var(--accent)}

/* 数字 */
.figs{display:grid;grid-template-columns:repeat(3,1fr);margin:24px 0 0;row-gap:6px}
.figs .v{font-size:32px;line-height:1.1}
.figs .v sub{font-size:13px;vertical-align:baseline;margin-left:2px;color:var(--ink2);font-style:normal}
.figs .k{font-size:12.5px;color:var(--ink2);line-height:20px}

/* 小节 */
.sec{margin:34px 0 4px;font-size:14px;line-height:30px;color:var(--accent);letter-spacing:.3em}

/* 今日条目 */
.entry{display:grid;grid-template-columns:50px 1fr auto;align-items:baseline;line-height:30px;font-size:15px}
.entry .t{font-size:14px;color:var(--ink2)}
.entry .d{color:var(--ink3);font-size:12.5px;padding-left:8px}
.entry .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;vertical-align:1px}
.entry.plan{color:var(--ink3)}
.entry.plan .dot{background:transparent!important;border:1px dashed var(--ink3)}
.entry.mark{color:var(--accent)}.entry.mark .t{color:var(--accent)}
.entry.now{color:var(--ink2);font-size:13px}.entry.now .t{color:var(--ink)}
.entry.past{opacity:.55}
.empty{color:var(--ink3);font-size:14px}

/* 主线 */
.eco{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 0}
.eco .v{font-size:30px;line-height:1.1}
.eco .k{font-size:12.5px;color:var(--ink2);line-height:20px}
.gene{margin-top:14px}
.toc{display:flex;align-items:baseline;line-height:30px;font-size:17px}
.toc .lead{flex:1;border-bottom:1.5px dotted var(--ink3);margin:0 8px;transform:translateY(-6px);opacity:.8}
.toc .r{font-size:15px;color:var(--ink2)}
.rh{display:grid;grid-template-columns:16px 1fr auto;align-items:baseline;line-height:30px;font-size:14.5px;padding-left:2px}
.rh .mk{width:8px;height:8px;border-radius:50%;border:1.2px solid var(--ink3);display:inline-block;transform:translateY(-1px)}
.rh.met .mk{background:var(--ink);border-color:var(--ink)}
.rh.miss .mk{border-color:var(--accent);background:transparent}
.rh.pend .mk{border-style:dashed}
.rh.noread .mk,.rh.dark .mk{border-color:transparent;background:repeating-linear-gradient(45deg,var(--ink3) 0 1px,transparent 1px 3px)}
.rh .nm{color:var(--ink)}
.rh .cur{font-size:14px;color:var(--ink2);white-space:nowrap;padding-left:8px}
.rh.miss .cur{color:var(--accent)}
.rh.met .cur{color:var(--ink)}
.rh .meta{grid-column:2/-1;color:var(--ink3);font-size:12px;line-height:18px;margin:-6px 0 6px}
.ll{display:grid;grid-template-columns:16px 1fr auto;align-items:baseline;line-height:30px;font-size:14.5px;padding-left:2px}
.ll .mk{font-size:12px;color:var(--ink3)}
.ll .cur{font-size:14px;color:var(--ink2);padding-left:8px}
.ll .bar{grid-column:2/-1;height:2px;background:var(--rule);margin:-8px 0 8px;position:relative}
.ll .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.ll .meta{grid-column:2/-1;color:var(--ink3);font-size:12px;line-height:18px;margin:-6px 0 6px}

/* 本周（09-22 第二批） */
.figs .p{font-size:11px;line-height:18px;color:var(--ink3);letter-spacing:.06em}
#v-week .figs .k{letter-spacing:.12em;min-height:40px}   /* 三个标签不等长，给两行的位置，下面的「上周」才对得齐 */
.wrow{display:grid;grid-template-columns:1fr auto 82px;align-items:baseline;line-height:30px;font-size:14.5px}
.wrow .v{color:var(--ink);font-size:14.5px;padding-left:10px;white-space:nowrap}
.wrow .dd{font-size:12.5px;color:var(--ink3);text-align:right;padding-left:10px;white-space:nowrap}
.wrow .dd.up{color:var(--c-work)}
.wrow .dd.dn{color:var(--accent)}
.note{color:var(--ink3);font-size:12px;line-height:20px;margin:4px 0 2px}
.vd{font-size:14.5px;line-height:28px;margin:6px 0}
.vd .ev{color:var(--ink3);font-size:12px;line-height:18px}
.vd .st{display:inline-block;margin-left:8px;padding:0 6px;line-height:18px;vertical-align:2px;
  font-size:11px;letter-spacing:.2em;border:1px solid var(--ink3);border-radius:3px;color:var(--ink3)}
.vd .st.open{border-color:var(--accent);color:var(--accent)}
.vd .st.applied,.vd .st.accepted{border-color:var(--ink);color:var(--ink)}

/* 「这条没发生」卡（09-23 第三批）：全页唯一可写动作。长按今天页一条已经过去的事件才出现 */
.entry[data-key]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ask{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(22,18,15,.3);padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.ask[hidden]{display:none}
.ask .card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--ink3);border-radius:4px;
  padding:16px 18px 10px;animation:rise .3s cubic-bezier(.2,.7,.2,1) both}
.ask .ttl{font-size:17px;line-height:1.6}
.ask .tm{font-size:12px;color:var(--ink2);letter-spacing:.08em}
.ask .q{margin:10px 0 2px;font-size:15px}
.ask .acts{display:flex;gap:30px;justify-content:flex-end;align-items:center;min-height:38px}
.ask .acts button{border:0;background:none;font:400 19px/1.6 var(--text);letter-spacing:.3em;color:var(--ink2);cursor:pointer;padding:2px 4px}
.ask .acts button[data-a=del]{color:var(--accent)}
.ask .err{color:var(--accent);font-size:13px;line-height:22px;word-break:break-all;margin-top:4px}
.ask .done{font-size:16px;line-height:2}
.ask .wait{font-size:13px;color:var(--ink3);letter-spacing:.1em}

/* 主线页（09-23 第三批）：今日配比带 + 久未碰排序 */
.lede2{font-size:19px;line-height:1.8;margin:14px 0 0;letter-spacing:.03em}
.lede2 u{text-decoration:none;color:var(--accent)}
.lede2 .ev{display:block;font-size:13px;color:var(--ink2);letter-spacing:.08em;line-height:1.9}
.ratio .bar{display:flex;height:14px;border-radius:2px;overflow:hidden;background:rgba(127,120,110,.14)}
.ratio .bar i{display:block;height:100%}
.ratio .lab{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--ink3);line-height:19px;margin-top:6px;letter-spacing:.06em}
.ratio .lab .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ratio .lab .r{flex:none;color:var(--ink2)}
.grow{display:grid;grid-template-columns:22px 1fr auto 24px;align-items:center;column-gap:10px;line-height:34px;cursor:pointer}
.grow .ico{width:22px;height:22px;opacity:.78;margin:0;display:inline-flex}
.grow .ico svg{width:100%;height:100%}
.grow .nm{font-size:16px;letter-spacing:.1em}
.grow .v{font-size:18px;color:var(--ink);white-space:nowrap}
.grow .v sub{font-size:11px;color:var(--ink3);margin-left:2px;vertical-align:baseline;font-style:normal}
/* 状态记号（09-23 改判）：原先是 24px 的框里塞 12px 的「饿 / 稳 / 满」三个宋体字，她看成了「恶 / 文」，框与字也对不齐。
   改成图鉴那支笔画的 16px 记号，flex 居中对齐行内基线（不用 grid place-items——那个会跟字体基线打架）。 */
.stamp{width:16px;height:16px;display:flex;align-items:center;justify-content:center;justify-self:end}
.stamp svg{display:block;width:16px;height:16px}
.gmeta{grid-column:2/-1;color:var(--ink3);font-size:11.5px;line-height:19px;margin:-9px 0 7px;letter-spacing:.04em}
.gmeta b{font-weight:400;color:var(--ink2)}
.detail{display:none;padding:0 0 4px}
.gene.open .detail{display:block}
.gene.open .grow .nm{color:var(--accent)}

/* 今天页翻页（09-23）：两个字符跟在星期后面，不另占一列——挂在 .hd 上会把大日期挤窄、逼它多折一行 */
.dsub{display:flex;align-items:center;gap:12px}
.pager{display:flex;align-items:center;gap:6px}
.pager button{border:0;background:none;padding:0 4px;font:300 20px/1 var(--text);color:var(--ink2);cursor:pointer}
.pager button[disabled]{opacity:.22;pointer-events:none}
.date[data-back]{cursor:pointer}
#v-today{touch-action:pan-y}

/* 本周页的图行（09-23）：名字 / 图 / 数，三列，名字长了省略号，375 下不换行不溢出 */
.gr{display:grid;grid-template-columns:1fr auto auto;align-items:center;column-gap:9px;line-height:28px;font-size:13.5px}
.gr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr .gx{display:flex;align-items:center}
.gr .gx svg{display:block}
.gr .cur{font-size:12.5px;color:var(--ink2);white-space:nowrap;text-align:right}
.gr .dd{font-size:11px;color:var(--ink3);white-space:nowrap;text-align:right;min-width:30px}
.gr .dd.up{color:var(--c-work)}
.gr .dd.dn{color:var(--accent)}
.gr.miss .cur{color:var(--accent)}
.gr.met .cur{color:var(--ink)}
.figs .bx{margin:2px 0 1px}
.figs .bx svg{display:block}
.figs .bx.prev{opacity:.42;transform:scale(.82);transform-origin:0 50%}
.stack{display:block;width:100%;height:12px;border-radius:2px}
.lgd{display:flex;flex-wrap:wrap;gap:0 12px;font-size:11px;color:var(--ink3);line-height:19px;margin-top:6px}
.lgd i{display:inline-block;width:7px;height:7px;border-radius:1px;margin-right:5px}
.axrow{margin:-4px 0 8px}
.axrow svg{display:block;width:100%;height:26px}

/* 底 */
.foot{margin-top:40px;color:var(--ink3);font-size:12px;line-height:20px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:56px;
  padding:10px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 62%,transparent)}
nav button{border:0;background:none;padding:6px 2px;font:17px/1 var(--text);color:var(--ink3);letter-spacing:.3em;position:relative;cursor:pointer}
nav button.on{color:var(--ink)}
nav button.on:after{content:"";position:absolute;left:18%;right:28%;bottom:-2px;height:2px;background:var(--accent);border-radius:2px}
.view{display:none}.view.on{display:block}

/* ---- 今日色带（所有质感共用） ---- */
.stripe{margin:24px 0 0}
.stripe .track{position:relative}
.stripe .bar{position:relative;height:12px;border-radius:6px;background:rgba(127,120,110,.14);overflow:hidden}
.stripe .seg{position:absolute;top:0;bottom:0}
.stripe .mark{position:absolute;top:-4px;bottom:-4px;border-left:1px dashed var(--accent)}
.stripe .nowtick{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}
.stripe .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);line-height:18px;margin-top:4px}

/* ================= 天色（她 09-21 选定）：思源宋体细体 + Cormorant 300 数字（09-22 起，原 Bodoni）；背景是此刻的天空，按南京当天真实日出日落走 ================= */
html[data-look=sky],
html[data-look=sky].night{
  --text:"Noto Serif SC","Songti SC",serif;--num:"Cormorant Garamond",Georgia,serif;--num-weight:300;--rule:transparent;--margin:transparent}
html[data-look=sky] body{font-weight:300;letter-spacing:.04em}
html[data-look=sky] .page{padding-left:26px;padding-right:26px}
html[data-look=sky] .page:before{display:none}   /* 纸本的页边线在天色里不可见，但 bottom:-2000px 会在页面底下多出两屏空白，去掉 */
html[data-look=sky] .date b{font-weight:300;font-size:32px;letter-spacing:.14em}
html[data-look=sky] .date span{font-size:12.5px;letter-spacing:.3em}
html[data-look=sky] .seal{transform:none;border-width:1px;border-radius:50%;width:62px;height:62px;font-size:14px}
html[data-look=sky] .count .n{font-size:118px;letter-spacing:-.04em;font-variant-numeric:lining-nums tabular-nums}
html[data-look=sky] .num{font-variant-numeric:lining-nums tabular-nums}
html[data-look=sky] .figs .v,html[data-look=sky] .eco .v{font-size:36px}
html[data-look=sky] .lede{font-size:19px;font-weight:400;letter-spacing:.08em;line-height:1.85}
html[data-look=sky] .nudge{font-size:14px;line-height:2;letter-spacing:.05em}
html[data-look=sky] .sec{font-size:11px;letter-spacing:.6em;margin-top:40px}
html[data-look=sky] .figs .k,
html[data-look=sky] .eco .k{font-size:11px;letter-spacing:.3em}
html[data-look=sky] .entry{line-height:40px;font-size:14.5px}
html[data-look=sky] .toc{font-size:17px;letter-spacing:.12em;line-height:42px;font-weight:400}
html[data-look=sky] nav button{font-size:14px;letter-spacing:.5em}

/* ---- 天色：背景是此刻的天空（清晨桃杏、正午天青、黄昏珊瑚、入夜靛紫），内容浮在毛玻璃上 ---- */
html[data-look=sky],html[data-look=sky].night{
  --paper:var(--sky-b,#f6efe3);--ink:#1f1c22;--ink2:#5d5663;--ink3:#8f8795;--accent:#c4432a;--accent-soft:rgba(196,67,42,.18);--glow:none;--grain:.04;--num-style:normal;
  --glass:rgba(255,255,255,.3);--glass-line:rgba(31,28,34,.16);
  --ill-ink:#1f1c22;--ill-fill:rgba(255,253,249,.92);--ill-accent:#c4432a;
  /* 主线色：降饱和，往靛 / 抹茶 / 金 / 朱靠（Zara 的和风四色）；灰度下靠明暗分层 */

<script>
/* ---------- 基础（口径与 diary.html 一致） ---------- */
const Q=new URLSearchParams(location.search), TOKEN=Q.get('token')||'';
const API='https://jddtovlvntdglfuezxdq.supabase.co/functions/v1/diary-panel';
const CAL_API='https://jddtovlvntdglfuezxdq.supabase.co/functions/v1/icloud-cal-mirror';   /* 「这条没发生」手势走 ?mode=delete；token 只从本页 URL 里来，不写死 */
const CAL_COLOR={'工作':'--c-work','关系':'--c-rel','身心':'--c-body','育儿':'--c-baby','自我投资':'--c-self','生活娱乐':'--c-life','休息':'--c-rest','时间黑洞':'--c-hole','携程':'--c-life'};
const PERIOD_CN={day:'今天',week:'本周',month:'本月',quarter:'本季',year:'今年'};
const NIGHT_RHYTHMS=new Set([3,15]); /* 手机不进床、睡前日记：day 周期但读数是「昨晚」 */
/* 收工线 / 躺平线：唤醒度 Protocols v1.3（2026-09-21 她定「底线的底线」）。时间轴刻度由 diary_snapshot().anchors 给。 */
const CLOSE_M=23*60, BED_M=23*60+30;
const NUDGE_TAIL=['停不下来：鼻子两吸、嘴一长呼，做三次。','还想看一眼：屏幕 22:45 已经灰了，明早它还在。','脑子还在转：把那件事说出来，说完就算交出去了。'];
const WEEK='日一二三四五六';
const CN_MONTH=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
let D=null, entered={today:false,main:false,week:false};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const hhmm=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.round(m%60));
function localNow(){return new Date()}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
/* 显示用清洗：去 emoji 与「| 12分钟」这类时长后缀；日历原文不动 */
const RENAME={'语言':'Duolingo'};   /* 她 09-21：「语言」其实是 Duolingo（西语 / 粤语 / 日语都在上面学） */
function clean(t){const s=String(t||'').replace(/\s*[|｜]\s*\d*\s*(小时)?\s*\d*\s*分钟?\s*$/,'').replace(/\s*[|｜]\s*$/,'')
  .replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}️‍]/gu,'').replace(/\s{2,}/g,' ').trim();return RENAME[s]||s||'（无题）'}
function cnDay(n){const a=['','一','二','三','四','五','六','七','八','九'];if(n<10)return a[n];if(n===10)return'十';if(n<20)return'十'+a[n-10];return a[Math.floor(n/10)]+'十'+a[n%10]}
function cnSpan(min){min=Math.max(0,Math.round(min));const h=Math.floor(min/60),m=min%60;const H=['零','一','两','三','四','五','六','七','八','九','十','十一','十二'];
  let s='';if(h)s+=(H[h]||h)+'小时';if(m){s+=(m<10&&h?'零':'')+cnDay(m)+'分'}else if(!h)s='不到一分钟';return s}

/* ---------- 读取 ---------- */
function paint(d,from){D=d;renderAll();foot(from)}
function foot(from){
  const hb=D&&D.heartbeats&&D.heartbeats.cal_mirror; let cal='日历未同步';
  if(hb){const min=Math.round((Date.now()-new Date(hb))/60000);cal=min>15?'日历 '+min+' 分钟未同步':'日历 '+min+' 分钟前'}
  $('#foot').textContent=(from==='cache'?'缓存 · ':'')+'更新于 '+new Date(D.generated_at).toTimeString().slice(0,5)+' · '+cal;
}
async function load(){
  if(!TOKEN){$('#foot').textContent='缺 token：请从主屏图标打开';return}
  try{const c=localStorage.getItem('diary.snap');if(c&&!D){paint(JSON.parse(c),'cache')}}catch(e){}
  try{
    const r=await fetch(API+'?token='+encodeURIComponent(TOKEN)+'&tab='+current(),{cache:'no-store'});
    const d=await r.json(); if(!d.ok)throw new Error(d.error||r.status);
    if(D&&D.weekly&&!d.weekly)d.weekly=D.weekly;   /* 出口只在 ?tab=week 带 weekly；别的 tab 回来时保住上一次的周数，本周页才不会闪回空 */
    try{localStorage.setItem('diary.snap',JSON.stringify(d))}catch(e){}
    paint(d,'net');
  }catch(e){$('#foot').textContent=(D?'用缓存 · ':'')+'读取失败：'+e.message}
}

/* ---------- 今天（09-23 起可以往前翻） ----------
   viewDay = null 就是今天，走原来的 D 与原来的刷新逻辑；不是 null 就从 dayCache 取那一天。
   往回最多 14 天，因为 cal-mirror 的窗口就是 back=14d——再往前库里根本没有镜像，翻过去只会给她一片空白。
   翻到过去的日子：没有「现在」，所以收工倒数、收工判读、睡前轻推、现在刻度全部不出现；
   留下的是那一天真实发生过的：时间轴、色带、那晚的睡眠、当天的身体。 */
const MAX_BACK=14;
const dayCache={};          /* 翻过的日子只在内存里缓存，不写 localStorage——那格留给今天 */
let viewDay=null, dayErr='';
function addDays(ds,n){const d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dayDiff(a,b){return Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/864e5)}
function goDay(n){
  if(!D)return;
  const t=addDays(viewDay||D.today,n), off=dayDiff(t,D.today);
  if(off>0||off<-MAX_BACK)return;                 /* 不能翻到未来，也不能翻出镜像窗口 */
  viewDay=off===0?null:t; dayErr='';
  if(viewDay&&!dayCache[viewDay])loadDay(viewDay); else renderToday();
  window.scrollTo(0,0);
}
function backToToday(){if(!viewDay)return;viewDay=null;dayErr='';renderToday();window.scrollTo(0,0)}
async function loadDay(day){
  renderToday();                                   /* 先把「正在读这一天…」画出来 */
  try{
    const r=await fetch(API+'?token='+encodeURIComponent(TOKEN)+'&tab=today&day='+encodeURIComponent(day),{cache:'no-store'});
    const d=await r.json(); if(!d.ok)throw new Error(d.error||r.status);
    dayCache[day]=d; dayErr='';
  }catch(e){dayErr=e.message}                      /* 读不到就说读不到，不拿今天的数顶替 */
  if(viewDay===day)renderToday();
}
function babyMinOf(T){let m=0;for(const e of T.today_events||[]){if(e.all_day||e.recurring||e.calendar!=='育儿')continue;
  const s=new Date(e.start),en=e.end?new Date(e.end):new Date(+s+15*60000);m+=Math.max(0,(en-s)/60000)}return m}
function todaySrc(){return viewDay?(dayCache[viewDay]||null):D}
function renderToday(){
  const el=$('#v-today'); if(!el||!D)return;
  const realBase=new Date(D.today+'T00:00:00+08:00'), realNowM=(localNow()-realBase)/60000;
  atmosphere(realNowM,D.today);                    /* 天色永远是此刻的天空，不跟着翻页走 */
  const isToday=!viewDay, day=viewDay||D.today, T=todaySrc(), off=isToday?0:dayDiff(day,D.today);
  const base=new Date(day+'T00:00:00+08:00'), nowM=isToday?realNowM:null;
  const [yy,mo,dd]=day.split('-').map(Number);
  const wd=WEEK[new Date(day+'T12:00:00+08:00').getDay()];
  const hour=localNow().getHours();
  const evening=isToday&&(hour>=18||hour<4||Q.get('close')==='1');   /* 过了午夜到 04:00 仍算「今晚」（她实测最晚躺下 03:05）；04:00 后是新的一天 */
  let h='<div class="hero">';
  h+=`<div class="hd"><div class="date"${isToday?'':' data-back="1"'}><b>${CN_MONTH[mo-1]}月${cnDay(dd)}日</b>`
    +`<div class="dsub"><span>星期${wd}${isToday?(evening?' · 晚':''):' · 点这里回到今天'}</span>`
    +`<span class="pager"><button data-d="-1"${off<=-MAX_BACK?' disabled':''} aria-label="前一天">‹</button>`
    +`<button data-d="1"${off>=0?' disabled':''} aria-label="后一天">›</button></span></div></div>`
    +(isToday?celestSVG(realNowM,D.today):'')+`</div>`;
  if(off<=-MAX_BACK)h+=`<div class="note">更早的日历没有镜像。</div>`;
  if(!T){h+=`<div class="note">${dayErr?esc('这一天没读到：'+dayErr):'正在读这一天…'}</div></div>`;el.innerHTML=h;return}
  if(isToday&&isStale(D))h+=`<div class="warn">这份数据不是今天的，正在等刷新。</div>`;
  const ln=T.last_night||{}, b=T.body_today||{};
  const budget=budgetLevel(ln);
  if(evening){
    const eveM=realNowM<4*60?realNowM+1440:realNowM, left=CLOSE_M-eveM;
    const big=left>0?`${Math.floor(left/60)}:${pad(Math.floor(left%60))}`:`+${Math.floor(-left/60)?Math.floor(-left/60)+':'+pad(Math.floor(-left%60)):Math.floor(-left)+'′'}`;
    const lede=left>0?`还有<u>${cnSpan(left)}</u>，<span class="nb">今天就收。</span>`:(eveM<BED_M?`已经过了收工线<u>${cnSpan(-left)}</u>。现在放下，${hhmm(BED_M)} 躺下。`:`过了躺下的时间<u>${cnSpan(eveM-BED_M)}</u>。什么都不用做完，去躺下。`);
    h+=`<div class="close"><div class="count"><div class="n num">${big}</div><div class="l">${left>0?'离收工':'已过收工'}</div><div class="seal">收<small>${hhmm(CLOSE_M)}</small></div></div><p class="lede">${lede}</p>${nudgeHTML(budget,day)}</div>`;
  }
  h+='</div>';
  const figs=[];
  if(ln.total_min!=null)figs.push([(ln.total_min/60).toFixed(1),'h',isToday?'昨晚睡了':'那晚睡了']);
  figs.push([String(T.deep_hours_today??0),'h',isToday?'今天深工':'当天深工']);
  if(evening)figs.push([budget,'','今晚预算']);
  else if(!isToday)figs.push(b.steps!=null?[b.steps.toLocaleString(),'','步数']:[String(Math.round(babyMinOf(T))),'分','陪悠悠']);
  else figs.push([String(Math.round(babyMinOf(T))),'分','陪悠悠']);
  if(b.steps!=null&&isToday&&!evening)figs.push([b.steps.toLocaleString(),'','步数']);
  h+=`<div class="figs">${figs.slice(0,3).map(([v,u,k])=>`<div><div class="v num">${esc(v)}${u?`<sub>${u}</sub>`:''}</div><div class="k">${esc(k)}</div></div>`).join('')}</div>`;
  h+=stripeHTML(T,base,nowM);
  h+=`<div class="sec">${isToday?'今 日':'那 天'}</div>`;
  h+=`<div class="list">${entriesHTML(T,base,nowM)}</div>`;
  el.innerHTML=h; enter(el,'today');
}
function nudgeHTML(budget,day){
  if(budget==='低'||budget==='—')return`<p class="nudge">今晚只做一件：手机放回书桌，洗个热澡就躺。</p>`;
  const n=Number(String(day).replace(/-/g,''))||0;
  return`<p class="nudge">手机放回书桌时，说两分钟：没做完的，明天第一步。热水澡，灯调暗，${hhmm(BED_M)} 躺下。<span class="tail">${NUDGE_TAIL[n%NUDGE_TAIL.length]}</span></p>`;
}
/* nowM = null 就是在看过去的某一天：没有「现在」，所以不画现在刻度、也不把整天都标成 past（一整天都是过去，标了反而全灰） */
function entriesHTML(T,base,nowM){
  const rows=[], live=nowM!=null;
  for(const e of T.today_events||[]){
    if(e.all_day)continue;
    const s=(new Date(e.start)-base)/60000, en=e.end?(new Date(e.end)-base)/60000:s+15, dur=Math.max(en-s,0);
    const sleep=e.calendar==='休息'&&/睡/.test(e.title||'');
    let label=clean(e.title), t=s, dtxt=fmtDur(dur);
    if(sleep&&s<12*60){label='醒来';t=en;dtxt='睡了 '+fmtDur(dur)}   /* 那一夜的觉：记醒来那一刻 */
    else if(sleep&&live&&s>nowM)continue;
    const cls=e.recurring?'plan':(live&&en<nowM-180?'past':'');
    /* 已经过去的非全天事件才带键——长按它＝「这条没发生」（第三批）。未来的不带，长按无反应 */
    const d=(e.uid&&(!live||s<=nowM))?` data-key="${esc(e.uid)}" data-start="${esc(e.start)}" data-end="${esc(e.end||'')}" data-title="${esc(clean(e.title))}" data-cal="${esc(e.calendar||'')}"`:'';
    rows.push({t,html:`<div class="entry ${cls}"${d}><span class="t num">${hhmm(Math.max(t,0))}</span><span><i class="dot" style="background:var(${CAL_COLOR[e.calendar]||'--c-life'})"></i>${esc(label)}${e.recurring?'（计划）':''}</span><span class="d">${dtxt}</span></div>`});
  }
  const anchors=(T.anchors||[]).map(a=>{const[hh,mm]=a.t.split(':').map(Number);return{t:hh*60+mm,label:a.label}});
  for(const a of anchors){if(a.label==='健身'&&(!live||a.t<nowM-30))continue;
    rows.push({t:a.t+.1,html:`<div class="entry mark"><span class="t num">${hhmm(a.t)}</span><span>${esc(a.label)}</span><span></span></div>`})}
  if(live&&nowM>0&&nowM<26*60)rows.push({t:nowM+.2,html:`<div class="entry now"><span class="t num">${hhmm(nowM)}</span><span>—— 现在 ——</span><span></span></div>`});
  if(!rows.length)return`<div class="empty">${live?'今天':'这一天'}的日历${live?'还是':'是'}空的。</div>`;
  return rows.sort((a,b)=>a.t-b.t).map(r=>r.html).join('');
}
function fmtDur(m){if(m<15)return'';if(m<60)return Math.round(m)+' 分';const h=Math.round(m/6)/10;return(Number.isInteger(h)?h:h.toFixed(1))+' 小时'}
function isStale(d){try{return d.today!==new Date(Date.now()+8*3600e3).toISOString().slice(0,10)}catch(e){return false}}
function budgetLevel(ln){ /* 身体预算＝昨晚的身体账，阈值取她 39 晚实测（08-12→09-20）：01:00 后躺平均只睡 6.24h（悬崖）；00:00–00:30 躺睡 7.56h（追平孕前）。故意不跟目标躺平线挂钩。 */
  if(!ln||ln.total_min==null)return'—';
  const bt=ln.bed_time||'00:00'; const late=(bt>='01:00'&&bt<'12:00');
  if(ln.total_min<360||late)return'低'; if(ln.total_min>=420&&(bt>='18:00'||bt<='00:30'))return'高'; return'中';
}

/* ---------- 「这条没发生」手势（09-23 第三批，拍板 #38） ----------
   长按今天页一条**已经过去**的非全天事件 600ms → 底部一张卡 → 「删」把它从苹果日历里删掉（周期事件只删这一个实例）。
   这是全页唯一的可写动作：没有按钮、没有输入框、不改时间、不新建（蓝图「不放」清单）。
   根因：私教这类周期占位是按周临时排的，天然对不上；删掉没发生的那一下，就是健身传感器（拍板 #33）说的「手动 confirm」。 */
let lpT=null, lpXY=null, lpBusy=false;
function lpCancel(){if(lpT){clearTimeout(lpT);lpT=null}}
document.addEventListener('pointerdown',ev=>{
  const el=ev.target.closest&&ev.target.closest('.entry[data-key]');
  if(!el||lpBusy||!$('#ask').hidden)return;
  if(new Date(el.dataset.start)>localNow())return;          /* 双保险：未来的不响应 */
  lpXY={x:ev.clientX,y:ev.clientY}; lpCancel();
  lpT=setTimeout(()=>{lpT=null;askCard(el)},600);
},{passive:true});
document.addEventListener('pointermove',ev=>{
  if(!lpT||!lpXY)return;
  if(Math.abs(ev.clientX-lpXY.x)>10||Math.abs(ev.clientY-lpXY.y)>10)lpCancel();   /* 挪动超过 10px＝在滚页面，不是长按 */
},{passive:true});
['pointerup','pointercancel','scroll','visibilitychange'].forEach(t=>document.addEventListener(t,lpCancel,{passive:true}));
function hm(iso){const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())}
function closeAsk(){const b=$('#ask');b.hidden=true;b.innerHTML='';b.onclick=null}
function askCard(el){
  const key=el.dataset.key, box=$('#ask');
  const span=hm(el.dataset.start)+(el.dataset.end?'–'+hm(el.dataset.end):'');
  box.innerHTML=`<div class="card"><div class="ttl">${esc(el.dataset.title)}</div>`+
    `<div class="tm">${esc(span)}${el.dataset.cal?' · '+esc(el.dataset.cal):''}</div>`+
    `<p class="q">这条没发生？</p><div class="acts"><button data-a="del">删</button><button data-a="keep">留</button></div></div>`;
  box.hidden=false;
  box.onclick=ev=>{
    const b=ev.target.closest('button');
    if(!b){if(ev.target===box)closeAsk();return}
    if(b.dataset.a==='keep'){closeAsk();return}
    doDelete(key,box);
  };
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
}
async function doDelete(key,box){
  lpBusy=true;
  const acts=box.querySelector('.acts'); if(acts)acts.innerHTML='<span class="wait">正在删…</span>';
  try{
    const r=await fetch(CAL_API+'?mode=delete&token='+encodeURIComponent(TOKEN)+'&key='+encodeURIComponent(key),{cache:'no-store'});
    let d=null; try{d=await r.json()}catch(e){}
    if(!d||!d.ok)throw new Error((d&&d.error)||('HTTP '+r.status));
    const S=todaySrc()||D;                                  /* 翻到过去的某天删，就从那天的缓存里抹掉 */
    S.today_events=(S.today_events||[]).filter(e=>e.uid!==key);
    if(S===D)try{localStorage.setItem('diary.snap',JSON.stringify(D))}catch(e){}
    renderAll();
    box.innerHTML='<div class="card"><div class="done">已从日历删掉</div></div>';
    setTimeout(()=>{closeAsk();load();if(viewDay){delete dayCache[viewDay];loadDay(viewDay)}},2000);   /* 2 秒收起，并重新取一次数：主线页的小时数跟着变 */
  }catch(e){
    /* 失败不自动消失、不吞原文——她要能看见是哪一步不行 */
    box.innerHTML='<div class="card"><div class="ttl">没删成</div><div class="err">'+esc(e.message)+'</div>'+
      '<div class="acts"><button data-a="keep">好</button></div></div>';
    box.onclick=ev=>{if(ev.target.closest('button')||ev.target===box)closeAsk()};
  }finally{lpBusy=false}
}

/* ---------- 主线 ---------- */
function classify(r){
  let cls='pend', cur='';
  if(r.status==='dark'||r.status==='error'){cls='dark';cur=r.status==='dark'?'暗':'没读到'}
  else if(r.status==='noread'){cls='noread';cur='没读到'}
  else{
    const v=r.current==null?0:Number(r.current), tgt=Number(r.target), isNight=NIGHT_RHYTHMS.has(r.id);
    if(r.period==='day'&&!isNight&&r.current!=null&&!r.met&&r.direction==='min')cls='pend'; /* 今天还没过完，不判红 */
    else if(r.met===true)cls='met'; else if(r.met===false)cls='miss'; else cls='pend';
    if(isNight)cur=(r.current==null?'昨晚没读到':(v>=1?'昨晚 ✓':'昨晚 ✗'));
    else if(r.direction==='max')cur=fmtN(v)+' / '+fmtN(tgt)+(r.unit?' '+r.unit:'');
    else if(tgt===1&&r.period!=='day')cur=v>=1?'✓':'0 / 1';
    else cur=fmtN(v)+' / '+fmtN(tgt)+(r.unit&&r.unit!=='次'?' '+r.unit:'');
  }
  return{cls,cur};
}
function fmtN(v){v=Number(v);return Math.abs(v)>=1000?v.toLocaleString():String(Math.round(v*10)/10)}
/* 久未碰 / 平稳 / 充足（09-23 第三批口径，拍板 #38；09-23 措辞改判：原「饿 / 稳 / 满」三个字她读成了「恶 / 文」，改词并改成记号）：
     久未碰 = 今日 0 小时 且 距上次 ≥ 2 天。90 天内一次都没有（days_since 为 null）也算，排最前，距上次写「90 天以上」。
     充足   = 本周小时 ≥ 1.3 × 前四周同进度均值，且该均值 > 0。
     其余   = 平稳。
   「前四周同进度均值」＝前 4 个完整周的周均 ×（本周已过天数 / 7），拿本周走到这里该有多少来比，不是拿整周比半周。
   口径排除「休息」与「时间黑洞」两本日历——它们是身体行的传感器，不是投入。
   排序：久未碰在前（距上次久的更前），平稳居中，充足在后。
   这是状态估计，不是计划（公理一）：只说哪条久没碰，不说该做什么。
   记号（图鉴那支笔）：久未碰＝朱红空心圆环，平稳＝墨色小点，充足＝墨色实心圆，没读到＝虚线圈。 */
const STAMP={
  hungry:`<svg class="ill" viewBox="0 0 16 16" aria-hidden="true"><circle class="ar tick" cx="8" cy="8" r="4.6"/></svg>`,
  stable:`<svg class="ill" viewBox="0 0 16 16" aria-hidden="true"><circle class="dot" cx="8" cy="8" r="2"/></svg>`,
  full:`<svg class="ill" viewBox="0 0 16 16" aria-hidden="true"><circle class="dot" cx="8" cy="8" r="4.6"/></svg>`,
  none:`<svg class="ill" viewBox="0 0 16 16" aria-hidden="true"><circle class="hair" cx="8" cy="8" r="4.4" stroke-dasharray="1.8 1.8"/></svg>`
};
function geneState(x){
  if(!x)return{k:'none',cn:'没读到'};
  const t=Number(x.today_h||0), w=Number(x.week_h||0), pr=Number(x.prior4_h||0), ds=x.days_since;
  if(t===0&&(ds==null||Number(ds)>=2))return{k:'hungry',cn:'久未碰'};
  if(pr>0&&w>=1.3*pr)return{k:'full',cn:'充足'};
  return{k:'stable',cn:'平稳'};
}
function detailHTML(rs,ls,g){
  let gh='';
  if(!rs.length&&!ls.length)gh+=`<div class="empty">还没有节律。</div>`;
  for(const r of rs){
    const {cls,cur}=classify(r), meta=[];
    if(r.period==='day'&&!NIGHT_RHYTHMS.has(r.id))meta.push('今天');else meta.push(PERIOD_CN[r.period]||r.period);
    if(r.days_since!=null&&r.period!=='quarter'&&r.period!=='month')meta.push('距上次 '+r.days_since+' 天');
    if(r.streak)meta.push('连续 '+r.streak+(r.period==='day'?' 天':r.period==='week'?' 周':' 期'));
    if(r.reason)meta.push(r.reason);
    gh+=`<div class="rh ${cls}"><span><i class="mk"></i></span><span class="nm">${esc(r.name)}</span><span class="cur num">${esc(cur)}</span><div class="meta">${esc(meta.join(' · '))}</div></div>`;
  }
  for(const l of ls){
    let cur='', extra='';
    if(l.status==='manual'){cur='';extra=`<div class="meta">出现即完成 · 手工登记</div>`}
    else if(l.status==='noread'||l.status==='error'){cur='没读到';extra=l.reason?`<div class="meta">${esc(l.reason)}</div>`:''}
    else{
      const pct=l.pct==null?null:Math.max(0,Math.min(100,Number(l.pct)));
      cur=pct!=null?pct+'%':(l.current!=null?fmtN(l.current)+(l.unit||''):'');
      const m=[];if(l.current!=null&&pct!=null)m.push('现在 '+fmtN(l.current)+(l.unit||''));if(l.end!=null)m.push('目标 '+fmtN(l.end)+(l.unit||''));if(l.note)m.push(l.note);
      extra=(pct!=null?`<div class="bar"><i style="width:${pct}%"></i></div>`:'')+(m.length?`<div class="meta">${esc(m.join(' · '))}</div>`:'');
    }
    gh+=`<div class="ll"><span class="mk">—</span><span>${esc(l.name)}</span><span class="cur num">${esc(cur)}</span>${extra}</div>`;
  }
  if(g.id==='self'&&D.friction_open!=null)gh+=`<div class="rh pend"><span><i class="mk"></i></span><span class="nm">拧巴登记 open</span><span class="cur num">${D.friction_open}</span></div>`;
  return gh;
}
const openGenes=new Set();
function renderMain(){
  const R=D.rhythms||[], L=D.longlines||[];
  const hasGS=Array.isArray(D.gene_stats), GS={};
  if(hasGS)for(const x of D.gene_stats)GS[x.gene_id]=x;
  const rows=(D.genes||[]).map(g=>({g,x:GS[g.id],st:geneState(GS[g.id])}));
  const rank={hungry:0,stable:1,none:1,full:2};
  const dsOf=r=>r.x&&r.x.days_since!=null?Number(r.x.days_since):9999;
  rows.sort((a,b)=>{
    if(rank[a.st.k]!==rank[b.st.k])return rank[a.st.k]-rank[b.st.k];
    if(a.st.k==='hungry'&&dsOf(a)!==dsOf(b))return dsOf(b)-dsOf(a);
    return (a.g.sort||0)-(b.g.sort||0);
  });
  const [yy,mo,dd]=D.today.split('-').map(Number);
  const base=new Date(D.today+'T00:00:00+08:00'), nowM=(localNow()-base)/60000, hour=localNow().getHours();
  const hungry=rows.filter(r=>r.st.k==='hungry');

  let h=`<div class="hero"><div class="hd"><div class="date"><b>主线</b><span>${CN_MONTH[mo-1]}月${cnDay(dd)}日 · 八条线，哪条久没碰</span></div></div>`;
  if(isStale(D))h+=`<div class="warn">这份数据不是今天的，正在等刷新。</div>`;
  if(!hasGS)h+=`<div class="warn">这份是旧版缓存，配比与状态取不到（出口还没给 gene_stats）。</div>`;
  let lede;
  if(!hasGS)lede=`等这一次刷新回来再判。`;
  else if(!hungry.length)lede=`今天<u>每条线都碰过了</u>。`;
  else{
    const h0=hungry[0], ds=h0.x&&h0.x.days_since!=null?h0.x.days_since+' 天':'90 天以上';
    lede=`今天最久没碰的是<u>${esc(h0.g.name)}</u>，今日 0 小时，距上次 ${ds}。`;
    /* 18 点后只补一句「还没碰的是谁」——不写「该做什么」（公理一：不生成计划） */
    if(hour>=18)lede+=`<span class="ev">今晚还没碰的是${hungry.slice(0,2).map(r=>esc(r.g.name)).join('、')}。</span>`;
  }
  h+=`<p class="lede2">${lede}</p></div>`;

  /* 今日配比带：8 段，宽度＝今日小时占比，主线各自的颜色 */
  const tot=rows.reduce((a,r)=>a+(r.x?Number(r.x.today_h||0):0),0);
  const withH=rows.filter(r=>r.x&&Number(r.x.today_h)>0).sort((a,b)=>Number(b.x.today_h)-Number(a.x.today_h));
  h+=`<div class="stripe ratio"><div class="bar">`+
     withH.map(r=>`<i style="width:${(Number(r.x.today_h)/tot*100).toFixed(2)}%;background:var(${GENE_COLOR[r.g.id]||'--c-life'})"></i>`).join('')+
     `</div><div class="lab"><span class="l">${withH.length?withH.slice(0,3).map(r=>esc(r.g.name)+' '+Number(r.x.today_h).toFixed(1)).join(' · '):'今天还没有记录到时间'}</span>`+
     `<span class="r">已记录 ${tot.toFixed(1)} h</span></div></div>`;
  h+=stripeHTML(D,base,nowM);   /* 缩略时间轴照旧，按日历上色；主线页永远看今天，不跟着今天页翻 */

  h+=`<div class="sec">目 录</div>`;
  for(const {g,x,st} of rows){
    const rs=R.filter(r=>r.gene_id===g.id), ls=L.filter(l=>l.gene_id===g.id);
    const t=x?Number(x.today_h||0):0, w=x?Number(x.week_h||0):0, pr=x?Number(x.prior4_h||0):0;
    const meta=[];
    meta.push(`本周 <b>${w.toFixed(1)}</b> / 前四周同进度 ${pr.toFixed(1)} h`);
    meta.push('距上次 '+(x&&x.days_since!=null?(Number(x.days_since)===0?'今天':x.days_since+' 天'):'90 天以上'));
    if(rs.length)meta.push('节律 '+rs.filter(r=>r.met).length+'/'+rs.length);
    h+=`<div class="gene${openGenes.has(g.id)?' open':''}" data-g="${esc(g.id)}" style="--g:var(${GENE_COLOR[g.id]||'--c-life'})">`+
       `<div class="grow"><span class="ico ill">${GENE_ICON[g.id]||''}</span><span class="nm">${esc(g.name)}</span>`+
       `<span class="v num">${hasGS?t.toFixed(1):'—'}<sub>h</sub></span>`+
       `<span class="stamp ${st.k}" role="img" aria-label="${esc(st.cn)}" title="${esc(st.cn)}">${STAMP[st.k]||STAMP.none}</span>`+
       `<div class="gmeta">${hasGS?meta.join(' · '):'小时数没读到'}</div></div>`+
       `<div class="detail">${detailHTML(rs,ls,g)}</div></div>`;
  }
  const el=$('#v-main'); el.innerHTML=h; enter(el,'main');
}
function enter(el,k){if(entered[k])return;entered[k]=true;el.classList.add('enter');setTimeout(()=>el.classList.remove('enter'),1400)}

/* 首页日 / 月：太阳在日出→日落之间画一道弧，月亮在日落→次日日出；贴地平线时太阳是朱红的。画布 120×96，地平线 y=84。 */
function celestSVG(nowM,ds){
  const {rise:r,set:st}=sunTimes(ds||D.today), m=((nowM%1440)+1440)%1440, H=84;
  const day=m>=r&&m<=st, f=day?(m-r)/(st-r):((m>st?m:m+1440)-st)/((r+1440)-st), alt=Math.sin(Math.PI*Math.max(0,Math.min(1,f)));
  const y=Math.round((H-alt*62)*10)/10, low=day&&alt<.28;
  let body;
  if(day){
    const rays=[0,45,90,135,180,225,270,315].map(a=>{const c=Math.cos(a*Math.PI/180),s=Math.sin(a*Math.PI/180);return`<path pathLength="1" d="M${(c*18).toFixed(1)} ${(s*18).toFixed(1)} L${(c*23).toFixed(1)} ${(s*23).toFixed(1)}"/>`}).join('');
    body=`<g class="sun${low?' low':''}" transform="translate(60 ${y})"><circle class="f" pathLength="1" r="13"/>${rays}</g>`+
      (alt>.35?`<path class="f dim" pathLength="1" d="M14 46 Q14 39 21 39.5 Q23 33 31 34.5 Q38 33 38 40 Q44 40 42 46Z"/>`:'');
  }else{
    body=`<g class="moon" transform="translate(60 ${y})"><path class="f" pathLength="1" d="M2 -13 A13 13 0 1 0 2 13 A10 10 0 1 1 2 -13Z"/><circle class="a" cx="-22" cy="-9" r="1.9"/></g>`+
      `<path class="dim" pathLength="1" d="M22 22 v4 m-2 -2 h4 M98 34 v4 m-2 -2 h4 M84 12 v3 m-1.5 -1.5 h3"/>`;
  }
  return`<svg class="celest ill" viewBox="0 0 120 96" aria-hidden="true"><defs><clipPath id="skyclip"><rect x="0" y="0" width="120" height="${H}"/></clipPath></defs>`+
    `<g clip-path="url(#skyclip)">${body}</g>`+
    `<path pathLength="1" d="M6 ${H} H114"/><path class="dim" pathLength="1" d="M58 ${H} Q80 72 108 ${H}"/><path pathLength="1" d="M17 ${H} L16 79.5 M21.5 ${H} L22 78.5 M26 ${H} L27.5 80 M95 ${H} L96.5 79.5"/></svg>`;
}
/* 今日色带：05:00→次日 02:00，每件事按日历分类上色——一天的形状 */
function stripeHTML(T,base,nowM){
  const S=5*60,E=26*60,X=m=>Math.max(0,Math.min(100,(m-S)/(E-S)*100));
  let seg='';
  for(const e of T.today_events||[]){
    if(e.all_day||e.recurring)continue;
    const s=(new Date(e.start)-base)/60000, en=e.end?(new Date(e.end)-base)/60000:s+15;
    if(en<=S||s>=E)continue;
    const a=X(s), w=Math.max(X(en)-a,.6);
    seg+=`<i class="seg" style="left:${a}%;width:${w}%;background:var(${CAL_COLOR[e.calendar]||'--c-life'})"></i>`;
  }
  const marks=(T.anchors||[]).filter(a=>a.label!=='健身').map(a=>{const[hh,mm]=a.t.split(':').map(Number);return`<i class="mark" style="left:${X(hh*60+mm)}%"></i>`}).join('');
  const now=(nowM!=null&&nowM>S&&nowM<E)?`<i class="nowtick" style="left:${X(nowM)}%"></i>`:'';

/* 天色：按南京（她现在的基地；回上海后改 LAT/LON，差约十分钟）当天真实日出日落，把天空关键帧钉在太阳上 */
const LAT=32.06, LON=118.80;
function sunTimes(dateStr){ /* NOAA 简化算法，返回当地（UTC+8）分钟；误差 ±2 分钟 */

function skyFrames(dateStr){

    [st+110,'#191a42','#2c2250',1],[1440,'#0c0d20','#1b1737',1]].sort((a,b)=>a[0]-b[0]);

function mix(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

/* ---------- 本周（09-22 第二批：数层 energy.weekly_review，出口 ?tab=week） ---------- */

function clockRel(m){if(m==null)return'—';m=((Math.round(Number(m))%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function delta(x){const v=Number(x);if(!isFinite(v))return{s:'',cls:''};

/* ---------- 本周页的图（09-23）：全部内联 SVG，沿用图鉴那支笔——纸 / 墨 / 一处朱红 ----------
   规矩：能数的画成可数的（格子 / 方格 / 圆点），有上限或有目标的画成量规（一根竖刻度就是目标），
   有构成的画成按日历上色的堆叠条，有时刻的画成一根小时间轴。没读到的段照旧只写「没读到」，不画空图。 */
const SV=(w,h,body,cls)=>`<svg class="ill ${cls||''}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${body}</svg>`;
/* (a) 格子条：1 格 = 1 小时/天，最后一格按小数填一部分，最多 9 格；ref 是「前四周日均」的竖刻度，条尾到刻度的距离就是差值 */
function cellsSVG(v,ref){
  const N=9,P=13,W=11,H=11,y=3, val=Math.max(0,Number(v)||0), fill=Math.min(val,N), full=Math.floor(fill+1e-9), frac=fill-full;
  let s='';
  for(let i=0;i<N;i++){const x=i*P;
    if(i<full){s+=`<rect class="dot" x="${x}" y="${y}" width="${W}" height="${H}" rx="1"/>`;continue}
    s+=`<rect class="hair" x="${x+.55}" y="${y+.55}" width="${W-1.1}" height="${H-1.1}" rx="1"/>`;
    if(i===full&&frac>.04)s+=`<rect class="dot" x="${x}" y="${y}" width="${(W*frac).toFixed(2)}" height="${H}" rx="1"/>`;
  }
  if(ref!=null&&isFinite(ref)){const rx=Math.min(Math.max(Number(ref),0),N)*P-1;

function boxesSVG(n,filled,opt){

function dotsSVG(n,done,miss){

/* (d) 堆叠条：按日历上色（填充走 style，否则会被 .ill * 的 fill:none 盖掉） */

    h+=`<div class="empty">本周判读未到${hb?'（心跳 '+new Date(hb).toTimeString().slice(0,5)+'）':'（还没有心跳）'}</div>`;
  }else for(const v of V){
    const e=v.evidence&&typeof v.evidence==='object'?Object.keys(v.evidence).map(k=>k+' '+v.evidence[k]).join(' · '):'';
    h+=`<div class="vd">${v.kind==='proposal'?'改判建议：':''}${esc(v.text)}`
      +(v.kind==='proposal'?`<i class="st ${esc(v.status)}">${esc(VD_ST[v.status]||v.status)}</i>`:'')
      +(e?`<div class="ev">${esc(e)}</div>`:'')+`</div>`;
  }
  h+=`</div>`;
  el.innerHTML=h; enter(el,'week');
}
function renderAll(){if(!D)return;renderToday();renderMain();renderWeek()}

/* ---------- tab：按时段落地（18 点前主线，18 点后今天），当次打开内可手动切换 ---------- */
function byTime(){const h=localNow().getHours();return h>=18||h<4?'today':'main'}
function current(){const b=document.querySelector('nav button.on');return b?b.dataset.v:byTime()}
function show(v){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));window.scrollTo(0,0)}
/* 主线页：点名字展开这条线的节律与长线（展开状态记在 openGenes 里，每分钟重画不会合上） */
$('#v-main').addEventListener('click',ev=>{
  const row=ev.target.closest('.grow'); if(!row)return;
  const gene=row.parentElement, id=gene.dataset.g;
  if(openGenes.has(id))openGenes.delete(id); else openGenes.add(id);
  gene.classList.toggle('open');
});
/* 今天页翻页（09-23）：‹ › 两个字符；日期行点一下回到今天；在今天视图里横向滑动也能翻一天 */
$('#v-today').addEventListener('click',ev=>{
  const b=ev.target.closest('.pager button');
  if(b){goDay(Number(b.dataset.d));return}
  if(ev.target.closest('.date[data-back]'))backToToday();
});
let swXY=null;
$('#v-today').addEventListener('pointerdown',ev=>{swXY={x:ev.clientX,y:ev.clientY}},{passive:true});
$('#v-today').addEventListener('pointercancel',()=>{swXY=null},{passive:true});
$('#v-today').addEventListener('pointerup',ev=>{
  const p=swXY; swXY=null;
  if(!p||!$('#ask').hidden)return;
  const dx=ev.clientX-p.x, dy=ev.clientY-p.y;
  if(Math.abs(dx)<60||Math.abs(dx)<=Math.abs(dy))return;   /* 横向 ≥60px 且横向大过纵向才算翻页，其余都还给滚动 */
  goDay(dx<0?1:-1);                                        /* 往左滑＝往后走一天（回到今天方向），往右滑＝往前翻 */
},{passive:true});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  show(b.dataset.v);
  if(b.dataset.v==='week'&&!(D&&D.weekly))load();   /* 周数只在 ?tab=week 的那次请求里来，本周页不进 byTime() 自动落地 */
}));
show(byTime());
/* hiddenAt 初值必须是「现在」，不能是 0：从 0 算起 Date.now()-0 永远大于 10 分钟，
   于是页面第一次从后台转到前台（在后台标签页里打开、或从别的 App 切回来）就会被判成「离开很久」，
   当场跳回 byTime() 的那一页——09-23 翻页实测撞到，才发现这个旧洞。 */
let hiddenAt=Date.now();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(Date.now()-hiddenAt>10*60e3){   /* 离开超过 10 分钟再回来：回到今天、按当前时段重新落地、重新判主题 */
    const h=localNow().getHours(), q=Q.get('theme');
    document.documentElement.classList.toggle('night',q?q==='night':(h>=20||h<6));
    viewDay=null; dayErr='';
    show(byTime());
  }
  load();
});
setInterval(()=>{if(D&&!document.hidden)renderAll()},60e3);   /* 页面开着时每分钟重画：天色与倒数跟着走 */
load();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
